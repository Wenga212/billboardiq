name = "billboardiq-traffic-engine"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Fires every 15 minutes; the handler self-filters per billboard: during
# that billboard's own peak hours (or a default school/office pattern if it
# hasn't declared any) it samples on every tick — 4 samples/hour — and
# otherwise just once/hour (only the :00 tick), matching the old baseline
# cadence off-peak. Each sample is one Google Routes API call for live vs.
# free-flow duration on the billboard's resolved traffic segment — see
# worker/src/index.js. Does NOT touch the ai_insights narrative — that's a
# separate, on-demand script (scripts/run-ai-insights.sh) so it never costs
# a billed API call automatically.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "billboardiq-db"
database_id = "80403077-0db6-48c6-9d8f-9f4a13ec3a08"

# Set with: wrangler secret put GOOGLE_MAPS_SERVER_KEY
# Server-side Maps Platform key with the Routes API enabled and billing
# active — must NOT be the same key embedded client-side in index.html/
# dashboard.html (that one is referrer-restricted to Maps JavaScript API).
#
# IMPORTANT: re-run this (with no code changes in between) after every
# `wrangler deploy` — this account's Wrangler version has been observed to
# silently drop the secret binding on a code deploy (see git history/session
# notes from 2026-09-14 to 2026-09-16 for the multi-day debugging trail this
# caused). No ANTHROPIC_API_KEY needed here anymore.
